# Nginx configuration for Rewaa Frontend (Next.js)
#
# Setup instructions on your Droplet:
# 1. Copy this file to /etc/nginx/sites-available/rewaa:
#    sudo cp rewaa.conf /etc/nginx/sites-available/rewaa
#
# 2. Update 'yourdomain.com' with your actual domain name below.
#
# 3. Enable the site:
#    sudo ln -s /etc/nginx/sites-available/rewaa /etc/nginx/sites-enabled/
#
# 4. Test and reload Nginx:
#    sudo nginx -t
#    sudo systemctl reload nginx
#
# 5. Provision free SSL certificate with Certbot:
#    sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com

server {
    server_name yourdomain.com www.yourdomain.com;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Max body size (adjust if you need larger file uploads)
    client_max_body_size 25M;

    # Next.js Static Assets (fingerprinted, safe to cache 1 year)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files (favicon, manifest, icons, etc.)
    location ~* ^/(favicon\.ico|icon.*|apple-icon.*|robots\.txt|manifest\.json) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # All application routes -> Next.js Standalone server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket / Connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 80;
}
