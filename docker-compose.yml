services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_LANDING_URL=${NEXT_PUBLIC_LANDING_URL}
        - NEXT_PUBLIC_SUPPORT_WHATSAPP=${NEXT_PUBLIC_SUPPORT_WHATSAPP}
    container_name: nextjs-template-app
    ports:
      - "3005:3000"
    env_file:
      - .env
    restart: always
